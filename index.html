<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OMGSocial — Your Amazing Feed</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="shortcut icon" href="logo.ico">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo"><img src="logo.svg" alt="OMGSocial" style="width:100%;height:100%"></div>
      <h1>OMGSocial</h1>
    </div>
    <div class="search"><input id="searchInput" placeholder="🔍 Search posts, people..."></div>
    <nav class="actions">
      <button class="compose">✍️ Compose</button>
      <button class="profile">👤 Profile</button>
    </nav>
    <div class="account" id="accountArea">
      <!-- Filled by JS -->
    </div>
  </header>

  <main class="container">
    <aside class="sidebar left">
      <div class="profile-card card-3d" id="sideProfileCard">
        <div class="avatar" id="sideAvatarWrap"><img id="sideAvatarImg" src="logo.svg" alt="avatar"></div>
        <div class="info">
          <div id="sideNameLine"><strong id="sideName">Guest</strong><span id="sideBadges"></span></div>
          <span id="sideHandle" style="font-size:13px;color:rgba(255,255,255,0.5)">@guest</span>
          <div id="sideAdminInfo" class="info-text" style="display:none">🌟 Official Administrator</div>
        </div>
      </div>
      <nav class="menu">
        <a class="active" data-action="home" role="button" tabindex="0">🏠 Home</a>
        <a data-action="explore" role="button" tabindex="0">🔥 Explore</a>
        <a data-action="notifications" role="button" tabindex="0">🔔 Notifications</a>
        <a data-action="messages" role="button" tabindex="0">💬 Messages</a>
      </nav>
    </aside>

    <section class="feed">
      <div class="compose-area card-3d">
        <textarea id="composeInput" placeholder="What's on your mind?" rows="3"></textarea>
        <div class="compose-actions">
          <button id="postBtn">🚀 Post</button>
        </div>
      </div>
      <div id="posts" class="posts"></div>
    </section>

    <aside class="sidebar right">
      <div class="trends card-3d">
        <h3 style="margin-top:0;margin-bottom:14px;color:#fff">🔥 Trending</h3>
        <ul class="trending-list">
          <li>✨ Amazing new features</li>
          <li>🚀 Join the community</li>
          <li>💡 Share your ideas</li>
        </ul>
        <div class="trends-note">⭐ Only on OMGSocial</div>
      </div>
    </aside>
  </main>

  <!-- Profile modal -->
  <div id="profileModal" class="modal hidden">
    <div class="modal-content card-3d">
      <h2>👤 Register / Edit Profile</h2>
      <form id="profileForm">
        <label>Display Name</label>
        <input id="pfName" type="text" placeholder="Your awesome name" required>
        
        <label>Handle</label>
        <input id="pfHandle" type="text" placeholder="username (no @ needed)" required>
        
        <label>Profile Picture</label>
        <input id="pfAvatarInput" type="file" accept="image/*">
        
        <div class="avatar-preview"><img id="pfAvatarPreview" src="logo.svg" alt="preview"></div>
        
        <div class="form-actions">
          <button type="submit">✅ Save Profile</button>
          <button type="button" id="pfClose">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Edit post modal -->
  <div id="editModal" class="modal hidden">
    <div class="modal-content card-3d">
      <h2>✏️ Edit Post</h2>
      <textarea id="editTextarea" rows="5"></textarea>
      <div class="form-actions">
        <button id="saveEdit">✅ Save Changes</button>
        <button id="cancelEdit">Cancel</button>
      </div>
    </div>
  </div>
  
  <script src="app.js"></script>
</body>
</html>
